context:
  version: "3.0.0.0.beta48"
  version_tag: "3.0.0-beta48"
  sha256: "0ff4bb312bbdd575440bda70f3f732127aa0e257be681a7674b78530090d4542"

package:
  name: argos3
  version: ${{ version }}

source:
  url: https://github.com/ilpincy/argos3/archive/${{ version_tag }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    - patches/0002-use-std-unordered-map.patch
    - patches/0003-read-install-prefix-at-runtime.patch
    - patches/beta48/0004-add-missing-std-includes.patch
    - patches/beta48/0005-cmake-keep-conda-flags.patch
    - patches/beta48/0006-cmake-lua-from-env.patch
    - patches/beta48/0007-cmake-qt-from-env.patch

build:
  number: 4
  # Same version as the GUI build (betaXX.yaml); told apart by the build string.
  # down_prioritize_variant adds a track_feature so solvers prefer the GUI
  # build unless this one is asked for explicitly (argos3=<version>=headless*).
  string: headless_h${{ hash }}_${{ build_number }}
  variant:
    down_prioritize_variant: 1
  script:
    env:
      ARGOS_GUI: "OFF"
    content: bash ${{ RECIPE_DIR }}/../build.sh

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake >=2.8.12,<4.0
    - make
    - pkg-config
  host:
    - freeimage
    - lua 5.5.*
    - if: linux
      then:
        - freeglut
        - xorg-libxi
        - xorg-libxmu
  run:
    - freeimage
    - lua 5.5.*
    - if: linux
      then:
        - freeglut
        - xorg-libxi
        - xorg-libxmu

tests:
  - script:
      - argos3 --version
      - test -z "$(ls $PREFIX/lib/argos3 | grep qtopengl)"
      - test -d $PREFIX/include/argos3
      - test "$CMAKE_INSTALL_PREFIX" = "$PREFIX"
      - test "${CMAKE_PREFIX_PATH%%:*}" = "$PREFIX"
      - test "$ARGoS_DIR" = "$PREFIX/share/argos3/cmake"

about:
  homepage: https://www.argos-sim.info
  license: MIT
  license_file: LICENSE
  summary: ARGoS – a fast, parallel, multi-physics, multi-robot simulator (beta48 / legacy) – headless (no Qt-OpenGL visualization)
  description: |
    ARGoS is a highly scalable multi-robot simulator used widely in
    swarm-robotics research. This legacy build (3.0.0-beta48) is kept for
    compatibility with older plug-ins (e.g. argos3-epuck v48).
  documentation: https://www.argos-sim.info/documentation.php
  repository: https://github.com/ilpincy/argos3
