context:
  version: "3.0.0.0.beta48"
  version_tag: "3.0.0-beta48"
  sha256: "0ff4bb312bbdd575440bda70f3f732127aa0e257be681a7674b78530090d4542"

package:
  name: argos3
  version: ${{ version }}

source:
  url: https://github.com/ilpincy/argos3/archive/${{ version_tag }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    - 0001-default-to-xcb-on-wsl.patch

build:
  number: 5
  # GUI build: includes the Qt-OpenGL visualization. The headless build of the
  # same version is betaXX-headless.yaml (build string headless_*).
  string: gui_h${{ hash }}_${{ build_number }}
  script:
    env:
      ARGOS_GUI: "ON"
    content: bash ${{ RECIPE_DIR }}/../build.sh

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake >=2.8.12,<4.0
    - make
    - pkg-config
  host:
    - freeimage
    - lua 5.5.*
    - qt-main  # Qt5: beta48 does not support Qt6
    - if: linux
      then:
        - freeglut
        - libgl-devel
        - libglu
        - xorg-libxi
        - xorg-libxmu
  run:
    - freeimage
    - lua 5.5.*
    - qt-main
    - if: linux
      then:
        - freeglut
        - libgl-devel
        - libglu
        - xorg-libxi
        - xorg-libxmu

tests:
  - script:
      - argos3 --version
      - ls $PREFIX/lib/argos3/libargos3plugin_simulator_qtopengl.*
      - test -d $PREFIX/include/argos3
      - test "$CMAKE_INSTALL_PREFIX" = "$PREFIX"
      - test "${CMAKE_PREFIX_PATH%%:*}" = "$PREFIX"
      - test "$ARGoS_DIR" = "$PREFIX/share/argos3/cmake"

about:
  homepage: https://www.argos-sim.info
  license: MIT
  license_file: LICENSE
  summary: ARGoS – a fast, parallel, multi-physics, multi-robot simulator (beta48 / legacy)
  description: |
    ARGoS is a highly scalable multi-robot simulator used widely in
    swarm-robotics research. This legacy build (3.0.0-beta48) is kept for
    compatibility with older plug-ins (e.g. argos3-epuck v48).
  documentation: https://www.argos-sim.info/documentation.php
  repository: https://github.com/ilpincy/argos3
