context:
  version: "3.0.0.0.beta59"
  version_tag: "3.0.0-beta59"
  sha256: "99007ef5eb10bbe4b8f88dcf0600c62c4cc0a5844e85ec0a3c3499b4637ee8b5"

package:
  name: argos3
  version: ${{ version }}

source:
  url: https://github.com/ilpincy/argos3/archive/${{ version_tag }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 3
  # GUI build: includes the Qt-OpenGL visualization. The headless build of the
  # same version is betaXX-headless.yaml (build string headless_*).
  string: gui_h${{ hash }}_${{ build_number }}
  script:
    env:
      ARGOS_GUI: "ON"
    content: bash ${{ RECIPE_DIR }}/../build.sh

requirements:
  build:
    - ${{ compiler("cxx") }}
    - cmake >=3.8.0
    - make
    - pkg-config
  host:
    - freeimage
    - lua 5.5.*
    # qt6-main >=6.11.2 needs macOS 14 (via moltenvk 1.4.2); building against
    # 6.11.1 keeps the GUI installable on macOS 11+. The run export
    # (>=6.11.1,<7) still lets newer Macs install a newer Qt 6.
    - qt6-main <6.11.2
    - if: linux
      then:
        - freeglut
        - libgl-devel
        - libglu
        - xorg-libxi
        - xorg-libxmu
  run:
    - freeimage
    - lua 5.5.*
    - qt6-main
    - if: linux
      then:
        - freeglut
        - libgl-devel
        - libglu
        - xorg-libxi
        - xorg-libxmu

tests:
  - script:
      - argos3 --version
      - ls $PREFIX/lib/argos3/libargos3plugin_simulator_qtopengl.*
      - test -d $PREFIX/include/argos3
      - test "$CMAKE_INSTALL_PREFIX" = "$PREFIX"
      - test "${CMAKE_PREFIX_PATH%%:*}" = "$PREFIX"
      - test "$ARGoS_DIR" = "$PREFIX/share/argos3/cmake"
      - test -f "$ARGoS_DIR/ARGoSConfig.cmake"

about:
  homepage: https://www.argos-sim.info
  license: MIT
  license_file: LICENSE
  summary: ARGoS – a fast, parallel, multi-physics, multi-robot simulator (beta59 / latest)
  description: |
    ARGoS is a highly scalable multi-robot simulator used widely in
    swarm-robotics research. This build is the latest release: 3.0.0-beta59.
  documentation: https://www.argos-sim.info/documentation.php
  repository: https://github.com/ilpincy/argos3
