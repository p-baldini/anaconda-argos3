context:
  version: "3.0.0.0.beta59"
  version_tag: "3.0.0-beta59"
  sha256: "99007ef5eb10bbe4b8f88dcf0600c62c4cc0a5844e85ec0a3c3499b4637ee8b5"

package:
  name: argos3
  version: ${{ version }}

source:
  url: https://github.com/ilpincy/argos3/archive/${{ version_tag }}.tar.gz
  sha256: ${{ sha256 }}

build:
  number: 0
  script: bash ${{ RECIPE_DIR }}/../build.sh

requirements:
  build:
    - ${{ compiler("cxx") }}
    - cmake >=3.5.1
    - make
    - pkg-config
  host:
    - freeimage
    - lua==5.5.0
    - if: linux
      then:
        - freeglut
        - libxi
        - libxmu
  run:
    - freeimage
    - lua 5.5.*
    - if: linux
      then:
        - freeglut
        - libxi
        - libxmu

tests:
  - script:
      - argos3 --version
      - test -d $PREFIX/include/argos3

about:
  homepage: https://www.argos-sim.info
  license: MIT
  license_file: LICENSE
  summary: ARGoS – a fast, parallel, multi-physics, multi-robot simulator (beta59 / latest)
  description: |
    ARGoS is a highly scalable multi-robot simulator used widely in
    swarm-robotics research. This build is the latest release: 3.0.0-beta59.
  documentation: https://www.argos-sim.info/documentation.php
  repository: https://github.com/ilpincy/argos3
