# Shared by every recipe (passed with -m in pixi.toml).
#
# Pin the C standard library the packages are built against. Without
# ${{ stdlib("c") }} the solver picks the newest conda-forge sysroot (glibc
# 2.39), the binaries need GLIBC_2.38 and the package declares no __glibc
# requirement, so it installs and then fails to load on older systems (e.g.
# WSL Ubuntu 22.04, glibc 2.35). With this pin the binaries only use glibc
# <= 2.28 symbols and the package gets a matching __glibc >=2.28 run
# requirement, so too-old systems are rejected by the solver instead.
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
c_stdlib_version:
  - if: linux
    then: "2.28"
  - if: osx and x86_64
    then: "10.13"
  - if: osx and arm64
    then: "11.0"
