name: Build anaconda packages

# Builds every recipe on every platform, tests the packages (test.yml) and,
# outside of PRs, uploads them to Anaconda.org (upload.yml).

on:
  push:
    branches: [master]
    paths:  # Only rebuild and upload when the package itself changes.
      - "recipe/**"
      - "build.sh"
  pull_request:
    branches: [master]   # build only, no upload on PRs
  workflow_dispatch:   # allow manual runs from the GitHub UI

# Only one release at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.version }} · ${{ matrix.platform.runner }})
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      fail-fast: false   # keep other platforms building even if one fails
      matrix:
        version: [beta48, beta48-headless, beta59, beta59-headless]
        platform:
          # ── macOS Apple Silicon ───────────────────────────────────────────
          - runner: macos-15           # M-series GitHub runner (osx-arm64)
            target: osx-arm64

          # ── macOS Intel ───────────────────────────────────────────────────
          - runner: macos-15-intel     # Intel GitHub runner (osx-64)
            target: osx-64

          # ── Linux x86-64 ─────────────────────────────────────────────────
          - runner: ubuntu-24.04
            target: linux-64

    steps:
      - name: Checkout feedstock
        uses: actions/checkout@v4

      # pixi is the only tool we need on the runner
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: latest
          cache: true

      # rattler-build is declared as a dependency in pixi.toml
      - name: Build ${{ matrix.version }} for ${{ matrix.platform.target }}
        run: pixi run build-${{ matrix.version }}
        env:
          # Prevent rattler-build from trying to open a browser for auth
          RATTLER_BUILD_NO_PROGRESS: "1"

      # Upload the built .conda file as a GitHub artifact so you can
      # download and test it locally before it hits Anaconda.org
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos3-${{ matrix.version }}-${{ matrix.platform.target }}
          path: output/${{ matrix.platform.target }}/argos3-*.conda
          if-no-files-found: error
          retention-days: 7

  # ── Run argos3-examples' diffusion experiment on every package ────────────
  test:
    name: Test
    needs: build
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      actions: read

  # ── Upload to Anaconda.org (only on pushes to master, not on PRs) ─────────
  upload:
    name: Upload
    needs: [build, test]                 # wait for ALL builds and tests to succeed
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/upload.yml
    permissions:
      contents: read
      actions: read
    secrets:
      ANACONDA_OWNER: ${{ secrets.ANACONDA_OWNER }}
      ANACONDA_API_KEY: ${{ secrets.ANACONDA_API_KEY }}
