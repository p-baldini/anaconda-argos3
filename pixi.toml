[workspace]
name = "anaconda-argos3"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
rattler-build = ">=0.76.0,<0.77"

[tasks]
build-beta59 = { cmd = "rattler-build build --recipe recipe/beta59.yaml --output-dir output" }
build-beta48 = { cmd = "rattler-build build --recipe recipe/beta48.yaml --output-dir output" }
build-all    = { depends-on = ["build-beta48", "build-beta59"] }

# rattler-build is exposed as a task so the upload job in CI can call it
# via `pixi run rattler-build upload anaconda ...`
rattler-build = { cmd = "rattler-build" }

# Upload everything built so far. Reads ANACONDA_OWNER / ANACONDA_API_KEY
# from the environment, or falls back to the token stored by `rattler-build
# auth login anaconda.org`.
upload = { cmd = "bash -c 'rattler-build upload anaconda $(find output -name \"*.conda\")'" }
